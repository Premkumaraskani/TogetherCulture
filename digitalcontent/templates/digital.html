<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Together Culture</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/styles.css' %}" />
    <style>
      .carousel {
        position: relative;
        width: 60%;
        margin: auto;
        overflow: hidden;
      }
      .carousel-inner {
        display: flex;
        width: 100%;
        transition: transform 0.2s ease-in-out;
      }
      .carousel-item {
        flex: 0 0 100%;
        text-align: center;
      }
      .carousel-item img {
        width: 100%;
        height: 15rem;
        border-radius: 10px;
      }
      .carousel-control {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        background: rgba(0, 0, 0, 0.5);
        color: white;
        border: none;
        padding: 10px;
        cursor: pointer;
      }
      .carousel-control-prev {
        left: 10px;
      }
      .carousel-control-next {
        right: 10px;
      }
      .search-sort-container {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin: 20px 0;
        width: 60%;
        margin: auto;
      }
      .search-bar {
        display: flex;
        align-items: center;
        gap: 10px;
        box-shadow: rgba(100, 100, 111, 0.2) 0px 7px 29px 0px;
        width: 20rem;
        height: 30px;
        padding: 8px;
        border-radius: 5px;
      }
      .search-bar input {
        border: none;
        outline: none;
        width: 100%;
      }
      .search-bar button {
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 3px;
        padding: 5px 10px;
        cursor: pointer;
      }
      .sort-by {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .sort-by select {
        padding: 5px;
        border-radius: 5px;
        border: 1px solid #ccc;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header class="dashboard-header">
        <div class="logo">
          <h1>Together Culture</h1>
        </div>
        <nav>
          <ul>
            <li><a href="#">Events</a></li>
            <li><a href="#">Membership</a></li>
            <li><a href="{% url 'user' %}">Users</a></li>
            <li><a href="#">Resources</a></li>
            <li><a href="{% url 'login' %}">Login</a></li>
            <li><a href="#">Cart</a></li>
          </ul>
        </nav>
      </header>

      <div class="search-sort-container">
        <div class="search-bar">
          <input type="text" placeholder="Search...">
          <button>Search</button>
        </div>
        <div class="sort-by">
          <label for="sort">Sort by:</label>
          <select id="sort">
            <option value="name">Name</option>
            <option value="date">Date</option>
          </select>
        </div>
      </div>

      <div class="carousel">
        <div class="carousel-inner">
          <div class="carousel-item active">
            <img src="https://img.freepik.com/premium-vector/book-festival-books-sale-back-school-concept-design-colorful-vector-design-illustrations_331172-1657.jpg?semt=ais_hybrid" alt="Harry Potter Book">
          </div>
          <div class="carousel-item">
            <img src="https://images.unsplash.com/photo-1526243741027-444d633d7365?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MjB8fGJvb2tzfGVufDB8fDB8fHww" alt="The Hobbit Book">
          </div>
          <div class="carousel-item">
            <img src="https://media.istockphoto.com/id/2154290498/photo/children-kindergarten-and-reading-book-in-classroom-childhood-development-and-growth-for.webp?a=1&b=1&s=612x612&w=0&k=20&c=WR985kHgWULaOHtIldFkVTSeHM7n6fhoAB0CDrcZSw4=" alt="Percy Jackson Book">
          </div>
        </div>
        <button class="carousel-control carousel-control-prev" onclick="prevSlide()">&#10094;</button>
        <button class="carousel-control carousel-control-next" onclick="nextSlide()">&#10095;</button>
      </div>

      <script>
        let currentIndex = 0;
        const slides = document.querySelectorAll(".carousel-item");
        const totalSlides = slides.length;

        function updateCarousel() {
          document.querySelector(".carousel-inner").style.transform = `translateX(-${currentIndex * 100}%)`;
        }

        function nextSlide() {
          currentIndex = (currentIndex + 1) % totalSlides;
          updateCarousel();
        }

        function prevSlide() {
          currentIndex = (currentIndex - 1 + totalSlides) % totalSlides;
          updateCarousel();
        }
      </script>

      <footer>
        <div class="footer-content">
          <div class="footer-left">
            <!-- <form id="signup-form">
              <input type="text" placeholder="First Name" required />
              <input type="text" placeholder="Last Name" required />
              <input type="email" placeholder="Email Address" required />
              <div class="button-group">
                <button type="submit">Sign Up</button>
                <button type="button" class="contact-us">Contact Us</button>
              </div>
            </form> -->
          </div>
          <div class="footer-right">
            <div class="social-icons">
              <a href="#"
                ><img src="{% static 'images/instagram.png' %}" alt="Instagram"
              /></a>
              <a href="#"
                ><img src="{% static 'images/whatsapp.png' %}" alt="WhatsApp"
              /></a>
            </div>
            <div class="footer-bottom">
              <p>&copy; 2025 TogetherCulture. All rights reserved.</p>
            </div>
          </div>
        </div>
      </footer>
    </div>
  </body>
</html>
