<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>New User Registeration</title>
    <!-- {% load static %} -->
    <link rel="stylesheet" href="{% static 'css/styles.css' %}" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"
    />
    <style>
      .password-container {
        position: relative;
      }
      .password-container input {
        width: 100%;
        padding-right: 30px;
      }
      .password-container .toggle-password {
        position: absolute;
        right: 10px;
        top: 50%;
        transform: translateY(-50%);
        cursor: pointer;
      }

      .interests-container {
        display: flex;
        flex-wrap: wrap;
      }

      .interest-tag {
        background-color: #e0e0e0;
        border-radius: 5px;
        padding: 5px 10px;
        margin: 5px;
        display: inline-flex;
        align-items: center;
      }

      .interest-tag i {
        margin-left: 5px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <div class="header-container">
          <a href="/" class="btn-back"
            ><i class="fas fa-arrow-left"></i> Back</a
          >
        </div>
      </header>

      <main>
        <div class="register-form">
          <h2>New User Registeration</h2>
          <form
            id="register-form"
            action="{% url 'userregister' %}"
            method="POST"
          >
            {% csrf_token %}
            <label for="first_name">First Name:</label>
            <input
              type="text"
              id="first_name"
              name="first_name"
              required
            /><br />

            <label for="last_name">Last Name:</label>
            <input type="text" id="last_name" name="last_name" required /><br />

            <label for="username">UserName:</label>
            <input type="text" id="username" name="username" required /><br />

            <label for="password">Password:</label>
            <div class="password-container">
              <input type="password" id="password" name="password" required /><i
                class="fas fa-eye toggle-password"
              ></i>
            </div>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required /><br />

            <label for="phoneno">Phone Number:</label>
            <div class="phone-input">
              <select id="country-code" name="country-code" required>
                <option value="+1">+1 (USA)</option>
                <option value="+44">+44 (UK)</option>
                <option value="+91">+91 (India)</option>
              </select>
              <input type="text" id="phoneno" name="phoneno" required />
            </div>
            <br />

            <label for="interests">Interests:</label>
            <div class="interests-container">
              <input
                type="text"
                id="interests-input"
                placeholder="Enter Your Interests"
              />
              <div id="interests-list"></div>
            </div>
            <br />

            <button type="submit" id="register-button">Sign In</button>
          </form>
          <div class="additional-links">
            <a href="{% url 'loginpage' %}">Already have an account? Login</a>
          </div>
        </div>
      </main>

      <footer>
        <div class="footer-left">
          <p>&copy; TogetherCulture</p>
        </div>
        <div class="footer-right">
          <p>Contact Info: info@togetherculture.com</p>
        </div>
      </footer>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
      $(document).ready(function () {
        var interests = [];

        $("#interests-input").on("keypress", function (event) {
          if (event.which === 13) {
            event.preventDefault();
            var interest = $(this).val().trim();
            if (interest && interests.length < 5) {
              interests.push(interest);
              $("#interests-list").append(
                '<span class="interest-tag">' +
                  interest +
                  '<i class="fas fa-times remove-interest" style="cursor:pointer; margin-left:10px;"></i></span>'
              );
              $(this).val("");
              console.log("Interest values :" + interests);
            }
          }
        });

        $(document).on("click", ".remove-interest", function () {
          var interest = $(this).parent().text().trim();
          interests = interests.filter(function (item) {
            return item !== interest;
          });
          $(this).parent().remove();
          console.log("Interest values :" + interests);
        });

        $("#register-form").on("submit", function (event) {
          var first_name = $("#first_name").val();
          var last_name = $("#last_name").val();
          var username = $("#username").val();
          var password = $("#password").val();
          var email = $("#email").val();
          var phoneno = $("#phoneno").val();

          if (
            !first_name ||
            !last_name ||
            !username ||
            !password ||
            !email ||
            !phoneno ||
            interests.length === 0
          ) {
            event.preventDefault();
            alert("Please fill the fields.");
            return;
          }

          $("<input>")
            .attr({
              type: "hidden",
              name: "interests",
              value: JSON.stringify(interests),
            })
            .appendTo("#register-form");

          $("<input>")
            .attr({ type: "hidden", name: "status", value: "Pending" })
            .appendTo("#register-form");
        });
        $(".toggle-password")
          .on("mousedown", function () {
            $("#password").attr("type", "text");
          })
          .on("mouseup mouseleave", function () {
            $("#password").attr("type", "password");
          });
      });
    </script>
  </body>
</html>
