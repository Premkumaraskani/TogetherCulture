<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>New User Registration</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/styles.css' %}" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"
    />
    <style>
      .password-container {
        position: relative;
      }
      .password-container input {
        width: 100%;
        padding-right: 30px;
      }
      .password-container .toggle-password {
        position: absolute;
        right: 10px;
        top: 50%;
        transform: translateY(-50%);
        cursor: pointer;
      }
      /* Popup styles */
      .popup {
        display: none;
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background-color: white;
        padding: 20px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        z-index: 1000;
      }
      .popup-overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.5);
        z-index: 999;
      }
      .popup button {
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <div class="header-container">
          <a href="/" class="btn-back">
            <i class="fas fa-arrow-left"></i> Back
          </a>
        </div>
      </header>

      <main>
        <div class="register-form">
          <h2>New User Registration</h2>
          <form
            id="register-form"
            action="{% url 'userregister' %}"
            method="POST"
          >
            {% csrf_token %}
            <label for="first_name">First Name:</label>
            <input
              type="text"
              id="first_name"
              name="first_name"
              required
            /><br />

            <label for="last_name">Last Name:</label>
            <input type="text" id="last_name" name="last_name" required /><br />

            <label for="username">UserName:</label>
            <input type="text" id="username" name="username" required /><br />

            <label for="password">Password:</label>
            <div class="password-container">
              <input type="password" id="password" name="password" required />
              <i class="fas fa-eye toggle-password"></i>
            </div>
            <br />

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required /><br />

            <label for="phoneno">Phone Number:</label>
            <div class="phone-input">
              <select id="country-code" name="country-code" required>
                <option value="+1">+1 (USA)</option>
                <option value="+44">+44 (UK)</option>
                <option value="+91">+91 (India)</option>
              </select>
              <input type="text" id="phoneno" name="phoneno" required />
            </div>
            <br />

            <label for="interests">Interests:</label>
            <div class="interests-container">
              <input
                type="text"
                id="interests-input"
                placeholder="Enter Your Interests"
              />
              <div id="interests-list"></div>
            </div>
            <br />

            <button type="submit" id="register-button">Sign In</button>
          </form>
          <div class="additional-links">
            <a href="{% url 'loginpage' %}">Already have an account? Login</a>
          </div>
        </div>
      </main>

      <footer>
        <div class="footer-left">
          <p>&copy; TogetherCulture</p>
        </div>
        <div class="footer-right">
          <p>Contact Info: info@togetherculture.com</p>
        </div>
      </footer>
    </div>

    <div class="popup-overlay" id="success-popup-overlay"></div>
    <div class="popup" id="success-popup">
      <p>Successfully registered!</p>
      <button id="popup-ok-button">OK</button>
    </div>

    <div class="popup-overlay" id="error-popup-overlay"></div>
    <div class="popup" id="error-popup">
      <h2>WarningMessage!</h2>
      <p id="error-popup-message">Username Already Exists</p>
      <button id="error-popup-ok-button">OK</button>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
      $(document).ready(function () {
        var interests = [];
        $("#interests-input").on("keypress", function (event) {
          if (event.which === 13) {
            event.preventDefault();
            var interest = $(this).val().trim();
            if (interest && interests.length < 5) {
              interests.push(interest);
              $("#interests-list").append(
                '<span class="interest-tag">' +
                  interest +
                  '<i class="fas fa-times remove-interest" style="cursor:pointer; margin-left:10px;"></i></span>'
              );
              $(this).val("");
            }
          }
        });
        $(document).on("click", ".remove-interest", function () {
          var interest = $(this).parent().text().trim();
          interests = interests.filter(function (item) {
            return item !== interest;
          });
          $(this).parent().remove();
        });

        $(".toggle-password")
          .on("mousedown", function () {
            $("#password").attr("type", "text");
          })
          .on("mouseup mouseleave", function () {
            $("#password").attr("type", "password");
          });

        $("#register-form").on("submit", function (event) {
          event.preventDefault();
          var first_name = $("#first_name").val();
          var last_name = $("#last_name").val();
          var username = $("#username").val();
          var password = $("#password").val();
          var email = $("#email").val();
          var phoneno = $("#phoneno").val();

          if (
            !first_name ||
            !last_name ||
            !username ||
            !password ||
            !email ||
            !phoneno ||
            interests.length === 0
          ) {
            alert("Please fill in all the fields.");
            return;
          }
          $.ajax({
            url: "{% url 'check_username' %}",
            type: "POST",
            data: {
              username: username,
              csrfmiddlewaretoken: "{{ csrf_token }}",
            },
            success: function (response) {
              if (response.exists) {
                $("#error-popup-message").text("Username Already Exists");
                $("#error-popup-overlay, #error-popup").show();
              } else {
                $("<input>")
                  .attr({
                    type: "hidden",
                    name: "interests",
                    value: JSON.stringify(interests),
                  })
                  .appendTo("#register-form");

                $("<input>")
                  .attr({ type: "hidden", name: "status", value: "Pending" })
                  .appendTo("#register-form");

                $("<input>")
                  .attr({ type: "hidden", name: "type", value: "Guest" })
                  .appendTo("#register-form");

                $("#success-popup-overlay, #success-popup").show();

                $("#popup-ok-button").one("click", function () {
                  $("#register-form")[0].submit();
                });
              }
            },
            error: function (xhr, status, error) {
              alert("An error occurred while checking username.");
            },
          });
        });
        $(document).on("click", "#error-popup-ok-button", function () {
          $("#error-popup-overlay, #error-popup").hide();
        });
      });
    </script>
  </body>
</html>
