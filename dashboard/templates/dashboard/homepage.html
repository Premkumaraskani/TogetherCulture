<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Together Culture</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/styles.css' %}" />
    <!-- <style>
        nav ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }
        nav ul li {
            display: inline;
            margin-right: 20px;
        }
        .nav-container {
            text-align: right;
        }
    </style> -->
  </head>
  <body>
    <div class="container">
      <header class="dashboard-header">
        <div class="logo">
          <h1>Together Culture</h1>
        </div>
        <nav>
          <ul>
            <li><a href="#">Events</a></li>
            <li><a href="#">Membership</a></li>
            <li><a href="#">Community</a></li>
            <li><a href="#">Resources</a></li>
            <li><a href="{% url 'login' %}">Login</a></li>
            <li><a href="#">Cart</a></li>
          </ul>
        </nav>
      </header>

      <main class="dashboard-main">
        <div class="dashboard-welcome-message">
          <h1>WELCOME</h1>
          <h2>To Together Culture</h2>
        </div>
      </main>

      <footer>
        <div class="footer-content">
          <div class="footer-left">
            <form id="signup-form">
              <input type="text" placeholder="First Name" required />
              <input type="text" placeholder="Last Name" required />
              <input type="email" placeholder="Email Address" required />
              <div class="button-group">
                <button type="submit">Sign Up</button>
                <button type="button" class="contact-us">Contact Us</button>
              </div>
            </form>
          </div>
          <div class="footer-right">
            <div class="social-icons">
              <a href="#"
                ><img src="{% static 'images/instagram.png' %}" alt="Instagram"
              /></a>
              <a href="#"
                ><img src="{% static 'images/whatsapp.png' %}" alt="WhatsApp"
              /></a>
            </div>
            <div class="footer-bottom">
              <p>&copy; 2025 TogetherCulture. All rights reserved.</p>
            </div>
          </div>
        </div>
      </footer>
    </div>
  </body>
</html>
